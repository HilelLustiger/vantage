name: Chore
description: Tooling/setup work, no user-facing behavior change
labels: ["type:chore"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - ingest
        - parser
        - docs
        - infra
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
    validations:
      required: true
