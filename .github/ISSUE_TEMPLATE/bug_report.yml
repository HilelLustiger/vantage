name: Bug report
description: Something is broken
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - ingest
        - parser
        - docs
        - infra
    validations:
      required: true
  - type: textarea
    id: whats-broken
    attributes:
      label: What's broken
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
