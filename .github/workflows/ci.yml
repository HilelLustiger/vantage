name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      SESSION_SECRET: ci-only-secret
      TAX_RATE: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run db:migrate --workspace=apps/backend --if-present
      - run: npm test --workspaces --if-present

  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, lint, test
        run: |
          if [ ! -f pyproject.toml ] && [ ! -f requirements.txt ]; then
            echo "no python project yet, skipping"
            exit 0
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install ruff pytest
          fi
          ruff check .
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then pytest; fi

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: |
          if [ -f docker-compose.yml ]; then
            cp .env.example .env
            docker compose config
          else
            echo "docker-compose.yml not present yet, skipping"
          fi
