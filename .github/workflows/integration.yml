name: Integration

# Full suite, including everything that needs a real Postgres — mirrors the
# pre-push hook (.husky/pre-push). Fast/DB-free checks live in checks.yml
# instead, so failures here are specifically about DB-backed behavior.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate --workspace=backend --if-present
      - run: npm test --workspace=backend --if-present
      - run: npm test --workspace=test --if-present
