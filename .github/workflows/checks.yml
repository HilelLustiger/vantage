name: Checks

# Fast, DB-free checks — mirrors the pre-commit hook (.husky/pre-commit).
# Full integration coverage lives in integration.yml instead.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspace=web --if-present

  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, lint, test
        run: |
          if [ ! -f pyproject.toml ] && [ ! -f requirements.txt ]; then
            echo "no python project yet, skipping"
            exit 0
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install ruff pytest
          fi
          ruff check .
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then pytest; fi

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: |
          if [ -f docker-compose.yml ]; then
            cp .env.example .env
            docker compose config
          else
            echo "docker-compose.yml not present yet, skipping"
          fi
