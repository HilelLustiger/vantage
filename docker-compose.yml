services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # local dev convenience (psql/GUI tools); container-internal port stays 5432

  backend:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    env_file: .env
    command: sh -c "npm ci && npm run dev --workspace=apps/backend"
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  web:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    command: sh -c "npm ci && npm run dev --workspace=apps/web -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  parser:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/parser:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    # no ports: — reachable only by backend, over the compose network (ADR 0003)

volumes:
  pgdata: {}
  node_modules: {}
